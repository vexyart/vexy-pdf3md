# this_file: pyproject.toml
[project]
name = "vexy-pdf3md"
dynamic = ["version"]
description = "Bulk PDF to Markdown with smart local strategies, fallback, and media export"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Adam Twardoch", email = "adam@twardoch.com" }
]
requires-python = ">=3.12"
keywords = ["pdf", "markdown", "ocr", "conversion", "pymupdf", "tesseract", "docling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]
dependencies = [
    "fire>=0.7.1",
    "loguru>=0.7.3",
    "pymupdf>=1.26",
]

[project.urls]
Documentation = "https://vexy.dev/vexy-pdf3md/"
Homepage = "https://github.com/vexyart/vexy-pdf3md"
Repository = "https://github.com/vexyart/vexy-pdf3md"
Issues = "https://github.com/vexyart/vexy-pdf3md/issues"
Changelog = "https://github.com/vexyart/vexy-pdf3md/blob/main/CHANGELOG.md"

[project.scripts]
vexy-pdf3md = "vexy_pdf3md.cli:main"
pdf3md = "vexy_pdf3md.cli:main"

[project.optional-dependencies]
docling = [
    "docling>=2.126,<3",
    "pydantic>=2.12",
]
all = [
    "vexy-pdf3md[docling]",
]

[build-system]
requires = ["hatchling>=1.32", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.1.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/vexy_pdf3md/__version__.py"
template = '''# this_file: src/vexy_pdf3md/__version__.py
# Generated by hatch-vcs. Do not edit or commit.
__version__ = version = {version!r}
'''

[tool.hatch.build.targets.wheel]
packages = ["src/vexy_pdf3md"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/*.md", "/pyproject.toml", "/uv.lock", "/test.sh", "/build.sh", "/publish.sh", "/LICENSE"]

[tool.hatch.envs.hatch-test]
extra-dependencies = ["pytest-cov"]

[tool.pytest.ini_options]
addopts = "-ra -m 'not optional'"
markers = ["optional: requires Docling and model downloads; run explicitly with -m optional"]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]

[tool.coverage.run]
source = ["vexy_pdf3md"]
omit = ["*/__version__.py"]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE"]

[dependency-groups]
dev = [
    "hatch-vcs>=0.5.0",
    "hatchling>=1.32.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]
